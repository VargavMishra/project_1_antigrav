name: Full-Stack CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Typecheck Backend (Server)
        run: npm run typecheck --workspace=apps/server

      - name: Typecheck Frontend (Web)
        run: npm run typecheck --workspace=apps/web

      - name: Run Backend Automated Tests (Vitest & Supertest)
        run: npm run test --workspace=apps/server

      - name: Build Backend Server
        run: npm run build --workspace=apps/server

      - name: Build Web Application
        run: npm run build --workspace=apps/web
